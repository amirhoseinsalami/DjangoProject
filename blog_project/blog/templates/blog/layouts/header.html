<nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4 px-4">

  <a class="navbar-brand" href="{% url 'home' %}">MySite</a>

  <button class="navbar-toggler" type="button"
          data-toggle="collapse" data-target="#navbarCollapse">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarCollapse">

    <!-- Left side -->
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="{% url 'home' %}">Home</a>
      </li>
      <li class="nav-item">

    </ul>

    <ul class="navbar-nav ml-auto align-items-center">

        <li class="nav-item mr-2">
          <a href="{% url 'accounts:profile' %}" class="btn btn-success">
            Profile
          </a>

        <li class="nav-item">
          <form method="post" action="{% url 'accounts:logout' %}">

            <button type="submit" class="btn btn-warning">Logout</button>

      {% else %}
        <li class="nav-item mr-2">
          <a href="{% url 'accounts:login' %}" class="btn btn-success">

        <li class="nav-item">
          <a href="{% url 'accounts:register' %}" class="btn btn-danger">
