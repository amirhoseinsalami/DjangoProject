{% extends "blog/base.html" %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow-lg border-0 rounded-4 text-center">
        <div class="card-body p-5">

          <!-- Avatar -->
          <div class="mb-4">
            <div class="rounded-circle bg-primary text-white d-inline-flex
                        align-items-center justify-content-center"
                 style="width:90px;height:90px;font-size:2rem;">
              {{ request.user.username|first|upper }}
            </div>
          </div>

          <!-- Username -->
          <h3 class="fw-bold mb-1">
            {{ request.user.username }}
          </h3>

          <!-- Email -->
          <p class="text-muted mb-4">
            {{ request.user.email|default:"No email provided" }}
          </p>

          <!-- Actions -->
          <div class="d-grid gap-2">

            <!-- Home link -->
            <a href="{% url 'home' %}"
               class="btn btn-outline-primary">
              🏠 Home
            </a>

            <!-- Logout (POST) -->
            <form method="post" action="{% url 'accounts:logout' %}">
              {% csrf_token %}
              <button type="submit"
                      class="btn btn-outline-danger w-100">
                🚪 Logout
              </button>
            </form>

          </div>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
