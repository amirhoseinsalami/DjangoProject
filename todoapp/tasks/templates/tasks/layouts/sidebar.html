<!-- templates/includes/sidebar.html -->
<div class="d-flex flex-column flex-shrink-0 p-3 bg-dark text-white" style="width:220px; min-height:100vh;">
  <a href="{% url 'home' %}" class="text-white text-decoration-none mb-4">
    <span class="fs-5 fw-bold">📝 TodoApp</span>
  </a>
  <hr>
  <ul class="nav nav-pills flex-column mb-auto gap-1">
    <li>
      <a href="{% url 'home' %}" class="nav-link text-white">🏠 Home</a>
    </li>
    {% if user.is_authenticated %}
    <li>
      <a href="{% url 'tasks:tasks_list' %}" class="nav-link text-white">📋 My Tasks</a>
    </li>
    {% endif %}
  </ul>
  <hr>
  {% if user.is_authenticated %}
  <a href="{% url 'accounts:profile' %}" class="nav-link text-white mb-2">👤 {{ user.username }}</a>
  <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit" class="nav-link text-white">🚪 Logout</button></form>
  {% else %}
    <a href="{% url 'accounts:login' %}" class="nav-link text-white mb-2">🔑 Login</a>
    <a href="{% url 'accounts:register' %}" class="nav-link text-white">📝 Register</a>
  {% endif %}
</div>
